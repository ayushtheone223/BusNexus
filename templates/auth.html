<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auth - BusNexus</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css" />
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .auth-container {
      width: 100%;
      max-width: 400px;
      padding: 2.5rem;
      position: relative;
      z-index: 10;
    }
    .auth-logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 2rem;
    }
    .auth-logo svg {
      margin-bottom: 1rem;
    }
    .auth-title {
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--text-primary);
    }
    .auth-subtitle {
      color: var(--text-secondary);
      font-size: 0.9rem;
      margin-top: 0.25rem;
    }
    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }
    .auth-switch {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.9rem;
      color: var(--text-secondary);
    }
    .auth-switch a {
      color: var(--cyan);
      text-decoration: none;
      font-weight: 500;
      cursor: pointer;
    }
    .auth-switch a:hover {
      text-decoration: underline;
    }
    #signupSection {
      display: none;
    }
  </style>
</head>
<body>
  
  <div class="bg-grid"></div>
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>

  <div class="glass-card auth-container">
    <div class="auth-logo">
      <svg width="36" height="36" viewBox="0 0 28 28" fill="none">
        <rect x="2" y="8" width="24" height="14" rx="3" stroke="url(#grad1)" stroke-width="2"/>
        <circle cx="8" cy="22" r="2.5" stroke="url(#grad1)" stroke-width="2"/>
        <circle cx="20" cy="22" r="2.5" stroke="url(#grad1)" stroke-width="2"/>
        <path d="M2 13h24" stroke="url(#grad1)" stroke-width="1.5"/>
        <path d="M9 8V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v3" stroke="url(#grad1)" stroke-width="1.5"/>
        <rect x="16" y="10" width="6" height="4" rx="1" fill="url(#grad1)" opacity="0.5"/>
        <defs>
          <linearGradient id="grad1" x1="0" y1="0" x2="28" y2="28" gradientUnits="userSpaceOnUse">
            <stop stop-color="#22d3ee"/>
            <stop offset="1" stop-color="#a855f7"/>
          </linearGradient>
        </defs>
      </svg>
      <div class="auth-title">Welcome to BusNexus</div>
      <div class="auth-subtitle" id="authSubtitle">Sign in to your account</div>
    </div>

    <!-- Login Form -->
    <form id="loginSection" class="auth-form" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="loginEmail" required placeholder="admin@school.edu">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="loginPassword" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; margin-top: 0.5rem; font-size: 1rem;">Sign In</button>
      <div class="auth-switch">
        Don't have an account? <a onclick="toggleAuth()">Sign up</a>
      </div>
    </form>

    <!-- Signup Form -->
    <form id="signupSection" class="auth-form" onsubmit="handleSignup(event)">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="signupName" required placeholder="John Doe">
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="signupEmail" required placeholder="john@school.edu">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="signupPassword" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; margin-top: 0.5rem; font-size: 1rem;">Create Account</button>
      <div class="auth-switch">
        Already have an account? <a onclick="toggleAuth()">Sign in</a>
      </div>
    </form>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script>
    function toggleAuth() {
      const login = document.getElementById('loginSection');
      const signup = document.getElementById('signupSection');
      const subtitle = document.getElementById('authSubtitle');
      
      if (login.style.display === 'none') {
        login.style.display = 'flex';
        signup.style.display = 'none';
        subtitle.textContent = 'Sign in to your account';
      } else {
        login.style.display = 'none';
        signup.style.display = 'flex';
        subtitle.textContent = 'Create a new account';
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value;
      const pass = document.getElementById('loginPassword').value;
      
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password: pass })
      });
      const data = await res.json();
      
      if (data.status === 'success') {
        window.location.href = '/dashboard';
      } else {
        showToast(data.message, 'error');
      }
    }

    async function handleSignup(e) {
      e.preventDefault();
      const name = document.getElementById('signupName').value;
      const email = document.getElementById('signupEmail').value;
      const pass = document.getElementById('signupPassword').value;
      
      const res = await fetch('/api/auth/signup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email, password: pass })
      });
      const data = await res.json();
      
      if (data.status === 'success') {
        window.location.href = '/dashboard';
      } else {
        showToast(data.message, 'error');
      }
    }

    function showToast(msg, type = 'info') {
      const icons = {
        error: `<svg class="toast-icon error" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`,
      };
      const toast = document.createElement('div');
      toast.className = `toast toast-${type}`;
      toast.innerHTML = `${icons[type] || ''}<span class="toast-msg">${msg}</span>`;
      document.getElementById('toastContainer').appendChild(toast);
      setTimeout(() => {
        toast.style.animation = 'toastOut 0.3s ease forwards';
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }
  </script>
</body>
</html>
